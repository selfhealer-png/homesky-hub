# Builds, signs and uploads the iOS app to TestFlight on Codemagic's Macs, so no Mac is needed.
# One-time setup (docs/IOS-RELEASE.md, step by step):
#   1. App Store Connect → Users and Access → Integrations → App Store Connect API: create a key
#      with the App Manager role. In Codemagic → Teams → Integrations → Developer Portal, add it
#      under the name below ("homesky ASC key"). Codemagic then creates and renews the signing
#      certificate and provisioning profile itself.
#   2. App Store Connect → Apps → + : an app with bundle ID app.homesky.hub. Put its Apple ID
#      (the number on its App Information page) in APP_STORE_APPLE_ID below.
#   3. Codemagic → this app → Environment variables, group "google": GOOGLE_IOS_CLIENT_ID (the iOS
#      OAuth client from Google Cloud). Optional until Google sign-in is wanted.
#   4. Optional: group "maps": VITE_MAP_TILE_KEY for the radar's map tiles (docs/IOS-RELEASE.md).
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: homesky ASC key
    environment:
      # Codemagic refuses a build that names a group that doesn't exist: create "google" first
      # (GOOGLE_IOS_CLIENT_ID may be left empty), and add "- maps" here once that group exists.
      groups:
        - google
      vars:
        APP_STORE_APPLE_ID: 0000000000 # replace with the app's Apple ID from App Store Connect
        HUB_RELEASE: '1'
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.homesky.hub
      node: 22
      xcode: latest
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: release/*
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install
        script: npm ci
      - name: Check
        script: npm run typecheck && npm test
      - name: Build the web content and sync it into the iOS project
        script: |
          export VITE_GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}"
          npm run build:app
          npx cap sync ios
      - name: Use the signing profiles
        script: xcode-project use-profiles
      - name: Build number one above the latest on TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build the signed .ipa
        script: |
          # Google returns to the app at its reversed client ID (Info.plist CFBundleURLSchemes).
          REVERSED=""
          if [ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]; then
            REVERSED="com.googleusercontent.apps.${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          fi
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            ${REVERSED:+--archive-xcargs "GOOGLE_REVERSED_CLIENT_ID=$REVERSED"}
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Households
