  <title>Hub setup</title>
  <script>
    // Inside the Home Screen app the status bar is black-translucent (white text over the page),
    // so the setup page goes dark there whatever the system setting, and its clock stays readable.
    if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.dataset.standalone = '';
  </script>
</head>

    <div class="navbar-inner">
      <div class="nav-left" id="nav-left"></div>

      <div class="nav-right"><a href="/" class="nav-done" title="Back to the display">Done</a></div>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="./setup/main.ts"></script>
</body>
</html>
