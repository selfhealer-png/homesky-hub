<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup wizard mock-up</title>
<!-- Mock-up of the iOS app's first-run setup: pick screens (with real screenshots from the app,
     captured at 1024×768 in app mode with the demo agenda), then one skippable page per picked
     screen that needs a choice. Not wired to anything. -->
<style>
  :root { --page: #f4f4f1; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d8d2; }
  @media (prefers-color-scheme: dark) { :root { --page: #161616; --ink: #ecebe6; --muted: #9a9993; --line: #33332f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 40px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  ol button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; width: 100%; box-sizing: border-box; color: var(--muted); font-size: 13px; }
  ol button.on { background: var(--line); color: var(--ink); }
  ol .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; flex: none; }
  ol button.on .n { background: #2563ff; border-color: #2563ff; color: #fff; }
  .note { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 3em; }

  /* The iPad, in the app's own first-run colours (src/web/styles.css .welcome / .ob-*). */
  main { overflow-x: auto; }
  .ipad { background: #1b1b1d; border-radius: 34px; padding: 18px; max-width: 1060px; min-width: 760px; }
  .scr { aspect-ratio: 4 / 3; background: #0b0f1a; border-radius: 16px; color: #f1f5f9; padding: 3.2% 3.6%; display: flex; flex-direction: column; container-type: inline-size; overflow: hidden; }
  .step { font-size: max(11px, 1.15cqw); letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }
  .q { font-size: 2.9cqw; font-weight: 700; margin: .4cqw 0 .3cqw; letter-spacing: -.01em; }
  .lede { font-size: max(11px, 1.55cqw); color: #94a3b8; margin: 0 0 1.6cqw; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 1cqw; margin-top: 1.4cqw; }
  .bar .count { font-size: max(11px, 1.4cqw); color: #94a3b8; }
  .btns { display: flex; gap: 1cqw; }
  .b { all: unset; cursor: pointer; font-size: max(11px, 1.55cqw); font-weight: 600; padding: .9cqw 2cqw; border-radius: 1cqw; border: 1px solid #334155; color: #e2e8f0; }
  .b.primary { background: #2563ff; border-color: #2563ff; color: #fff; }
  .b[hidden] { display: none; }

  /* Three across, so each preview is big enough to read. The rows run past the bottom on purpose:
     the cut-off row says "there's more" (iPad hides scrollbars), and the pill says it in words. */
  .scroller { position: relative; flex: 1; min-height: 0; }
  .scroll { height: 100%; overflow-y: auto; scrollbar-width: thin; padding-right: .4cqw; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6cqw; padding-bottom: 1cqw; }
  .more { position: absolute; left: 50%; bottom: 1.2cqw; transform: translateX(-50%); font-size: max(11px, 1.35cqw); font-weight: 600; background: #2563ff; color: #fff; padding: .6cqw 1.6cqw; border-radius: 99px; pointer-events: none; transition: opacity .2s; }
  .more.gone { opacity: 0; }
  .tile { all: unset; cursor: pointer; display: flex; flex-direction: column; border-radius: 1.2cqw; background: #151b2b; border: 2px solid #1f2738; overflow: hidden; position: relative; }
  .tile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; opacity: .55; transition: opacity .15s; }
  .tile.sel { border-color: #2563ff; }
  .tile.sel img { opacity: 1; }
  .tile .t { padding: 1cqw 1.3cqw 1.1cqw; }
  .tile b { display: block; font-size: max(12px, 1.9cqw); font-weight: 600; }
  .tile small { display: block; font-size: max(11px, 1.45cqw); color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tick { position: absolute; top: 1cqw; right: 1cqw; width: 3.2cqw; height: 3.2cqw; border-radius: 50%; border: 2px solid #fff; background: rgba(11,15,26,.55); display: grid; place-items: center; font-size: max(11px, 1.4cqw); color: transparent; }
  .tile.sel .tick { background: #2563ff; border-color: #2563ff; color: #fff; }
  .ex { position: absolute; left: .7cqw; top: .7cqw; font-size: max(11px, 1cqw); background: rgba(11,15,26,.75); color: #cbd5e1; padding: .2cqw .6cqw; border-radius: .6cqw; }

  .page { display: grid; grid-template-columns: 38% minmax(0, 1fr); gap: 2.4cqw; align-items: start; height: 100%; }
  .shot { border-radius: 1.2cqw; overflow: hidden; border: 1px solid #1f2738; }
  .shot img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .cap { font-size: max(11px, 1.15cqw); color: #94a3b8; margin-top: .6cqw; }
  .opts { display: flex; flex-direction: column; gap: .9cqw; }
  .opt { all: unset; cursor: pointer; display: flex; gap: 1.2cqw; align-items: center; padding: 1.1cqw 1.4cqw; border-radius: 1.1cqw; background: #151b2b; border: 2px solid #1f2738; }
  .opt.pick { border-color: #2563ff; background: #16224a; }
  .opt .dot { width: 1.6cqw; height: 1.6cqw; border-radius: 50%; border: 2px solid #64748b; flex: none; }
  .opt.pick .dot { border-color: #2563ff; background: #2563ff; box-shadow: inset 0 0 0 .35cqw #16224a; }
  .opt b { display: block; font-size: max(11px, 1.6cqw); font-weight: 600; }
  .opt small { display: block; font-size: max(11px, 1.2cqw); color: #94a3b8; }
  .perm { margin-left: auto; font-size: max(11px, 1.05cqw); color: #fcd34d; border: 1px solid #a16207; border-radius: .6cqw; padding: .2cqw .6cqw; white-space: nowrap; }
  .centre { max-width: 62%; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Setup wizard</h1>
    <p class="sub">Pick screens, then set up each one. Every step can be skipped.</p>
    <ol id="steps"></ol>
    <p class="note" id="note"></p>
  </aside>
  <main>
    <div class="ipad"><div class="scr" id="scr"></div></div>
  </main>
</div>
<script>
// [id, name, one line, picked by default, needs location]
const SCREENS = [
  ['home', 'Home', 'Calendar and tasks', true, false],
  ['weather', 'Weather', 'Now, today and the week', true, true],
  ['rain', 'Rain radar', 'Rain on its way', false, true],
  ['tides', 'Tides', 'For a place by the sea', false, true],
  ['board', 'Overhead board', 'The plane above you', false, true],
  ['radar', 'Radar', 'Planes around you', true, true],
  ['airport', 'Airport board', 'Arrivals and departures', false, true],
  ['flight', 'Flight tracker', 'One flight, anywhere', false, false],
  ['tonight', 'Tonight', 'Worth looking up?', false, true],
  ['iss', 'Space Station', 'Where it is now', false, true],
  ['clock', 'Clock', 'Word, digital, analogue, flap', true, false],
  ['photos', 'Photos', 'A photo frame', true, false],
  ['wiki', 'Wikipedia', 'Article of the day', false, false],
];
const SHOT = id => id === 'photos' ? 'https://picsum.photos/seed/hsh-coast/1024/768' : `wizard/${id}.jpg`;
const NAME = Object.fromEntries(SCREENS.map(s => [s[0], s[1]]));
const PERM = 'iOS asks permission';

// One page for each screen that needs a choice; the rest are ready as soon as they're picked.
const PAGES = {
  home: { q: 'Which calendars should Home show?', l: 'Events, overdue items and the next few days.', o: [
    ['Calendars on this iPad', 'iCloud, Google and Exchange accounts. Tick which ones next.', PERM],
    ['Reminders on this iPad', 'Overdue and due today, beside your events.', PERM],
    ['Paste a calendar link', 'Any iCal or webcal address'],
    ['Connect Google', 'Calendar and Tasks, read-only']], why: 'Calendars and Reminders are separate iOS permissions, each asked only when chosen.' },
  weather: { q: 'Weather', l: 'Shown for where this screen is. Both are on unless you turn them off.', multi: true, o: [
    ['Show what to wear', 'Coat, jumper, umbrella, sunglasses'],
    ['Pollen and air quality', 'Only in the pollen season']], why: 'Nothing is required here, so Next and Skip do the same.' },
  tides: { q: 'Where should tides be read?', l: 'Nearest places on the coast to this screen.', o: [
    ['Southend-on-Sea', '58 km'], ['Brighton', '76 km'], ['Search another place', '']], why: 'Skipping leaves Tides out of rotation until a place is chosen.' },
  board: { q: 'Pick a board style', l: 'The plane passing closest overhead, on a split-flap board.', o: [
    ['Classic', 'Cream letters on black'], ['Departures', 'Yellow on black'], ['Modern', 'Clean and bright']], why: 'Tapping the board later cycles through the styles.' },
  radar: { q: 'How should the radar look?', l: 'Live aircraft around you.', o: [
    ['Street map', 'Towns and roads'], ['Satellite', 'From above'], ['Plain', 'Rings only, nothing behind']], why: 'Range (25 nm) and rare-aircraft alerts can be changed in Settings.' },
  airport: { q: 'Which airport?', l: 'Suggested from where this screen is.', o: [
    ['London Heathrow', 'LHR · 22 km'], ['London City', 'LCY · 12 km'], ['Search another airport', '']], why: 'Captured near midnight, when Heathrow has no flights, so the screenshot board is empty.' },
  flight: { q: 'Which flight should it follow?', l: 'A flight number, callsign or registration.', o: [
    ['BA15', 'London to Singapore'], ['Type another', 'For example G-XLEA']], why: 'Skipping leaves the tracker out of rotation until a flight is chosen.' },
  clock: { q: 'Pick a clock', l: 'You can change it any time.', o: [
    ['Word clock', 'IT IS TEN TO TWELVE'], ['Digital', '23:50'], ['Analogue', 'Hands and a dial'], ['Split-flap', 'Like a station board']], why: 'The real step shows live previews of each style, as today’s wizard does.' },
  photos: { q: 'Where should photos come from?', l: 'Shown live, so new photos appear on their own.', o: [
    ['An album in Apple Photos', 'Shared Albums work too', PERM],
    ['A Dropbox folder', 'Streamed, with a small cache'],
    ['A Google Drive folder', 'Chosen in Google’s picker'],
    ['Pick from Google Photos', 'Copied once; new photos need a new pick']], why: 'Example photo: there were none in the test copy to capture.' },
};

let picked = new Set(SCREENS.filter(s => s[3]).map(s => s[0]));
const choice = {};
let at = 0;

function steps() {
  const list = [{ k: 'welcome', t: 'Welcome' }, { k: 'pick', t: 'Pick screens' }];
  let located = false;
  for (const [id, name, , , loc] of SCREENS) {
    if (!picked.has(id)) continue;
    if (loc && !located) { list.push({ k: 'location', t: 'Location' }); located = true; }
    if (PAGES[id]) list.push({ k: id, t: name });
  }
  list.push({ k: 'finish', t: 'Finishing touches' });
  return list;
}

const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const opt = (o, i, key, multi) => {
  const on = multi ? (choice[key] ?? [0, 1]).includes(i) : (choice[key] ?? 0) === i;
  return `<button class="opt ${on ? 'pick' : ''}" data-key="${key}" data-i="${i}" data-multi="${multi ? 1 : ''}"><span class="dot"></span><span><b>${o[0]}</b>${o[1] ? `<small>${o[1]}</small>` : ''}</span>${o[2] ? `<span class="perm">${o[2]}</span>` : ''}</button>`;
};

function render() {
  const list = steps();
  at = Math.min(at, list.length - 1);
  const s = list[at];
  document.getElementById('steps').replaceChildren(...list.map((x, i) =>
    el(`<li><button class="${i === at ? 'on' : ''}" data-go="${i}"><span class="n">${i + 1}</span>${x.t}</button></li>`)));

  let body = '', q = '', lede = '', note = '';
  if (s.k === 'welcome') {
    q = 'Welcome to Home&amp;Sky Hub';
    lede = 'This iPad becomes a calm display for home and the sky above it.';
    body = `<div class="centre"><p class="lede" style="font-size:1.8cqw;color:#cbd5e1">First pick the screens you want to see. Then set each one up, or skip it and come back later in Settings. It takes a couple of minutes.</p></div>`;
    note = 'No account, password or pairing.';
  } else if (s.k === 'pick') {
    q = 'Which screens would you like?';
    lede = 'They take turns on the display. Tap to add or remove.';
    body = `<div class="scroller"><div class="scroll" id="pickScroll"><div class="grid">${SCREENS.map(([id, name, line]) => `
      <button class="tile ${picked.has(id) ? 'sel' : ''}" data-pick="${id}" aria-pressed="${picked.has(id)}">
        <img src="${SHOT(id)}" alt="">${id === 'photos' ? '<span class="ex">Example photo</span>' : ''}
        <span class="tick">✓</span>
        <span class="t"><b>${name}</b><small>${line}</small></span>
      </button>`).join('')}</div></div><span class="more" id="more">Scroll for more screens ↓</span></div>`;
    note = 'Real screenshots from the app. The steps on the left follow the picks.';
  } else if (s.k === 'location') {
    q = 'Where is this screen?';
    lede = 'Weather and the sky screens are centred here, rounded to about 1 km.';
    body = `<div class="opts centre">${[
      ['Use this iPad’s location', 'Best for a screen that stays at home', PERM],
      ['Choose a place', 'Search a town or postcode instead']].map((o, i) => opt(o, i, 'location')).join('')}</div>`;
    note = 'Asked once, just before the first picked screen that needs it.';
  } else if (s.k === 'finish') {
    q = 'Finishing touches';
    lede = 'How the display behaves through the day.';
    body = `<div class="opts centre">${[
      ['Motion: Gentle', 'Full, gentle or still'],
      ['Quiet hours: 22:30 to 06:30', 'Dims and shows only the calm screens'],
      ['Keep it on power', 'The screen stays on by itself']].map((o, i) => opt(o, i, 'finish', true)).join('')}</div>`;
    note = 'Ends on the display. Long-press anywhere for Settings.';
  } else {
    const p = PAGES[s.k];
    q = p.q; lede = p.l; note = p.why;
    body = `<div class="page">
      <div><div class="shot"><img src="${SHOT(s.k)}" alt=""></div><div class="cap">${NAME[s.k]} screen</div></div>
      <div class="opts">${p.o.map((o, i) => opt(o, i, s.k, p.multi)).join('')}</div></div>`;
  }

  const last = s.k === 'finish';
  const skippable = !['welcome', 'pick', 'finish'].includes(s.k);
  const count = s.k === 'pick' ? `${picked.size} screen${picked.size === 1 ? '' : 's'} picked` : '';
  const scr = document.getElementById('scr');
  scr.innerHTML = `
    <div class="step">Step ${at + 1} of ${list.length}</div>
    <div class="q">${q}</div><p class="lede">${lede}</p>
    <div class="body">${body}</div>
    <div class="bar"><span class="count">${count}</span><span class="btns">
      <button class="b" data-nav="-1" ${at ? '' : 'hidden'}>Back</button>
      <button class="b" data-nav="1" ${skippable ? '' : 'hidden'}>Skip</button>
      <button class="b primary" data-nav="1">${s.k === 'welcome' ? 'Get started' : last ? 'Start the display' : 'Next'}</button>
    </span></div>`;
  document.getElementById('note').textContent = note;
  const sc = document.getElementById('pickScroll');
  if (sc) {
    sc.scrollTop = pickScrollTop;
    const more = document.getElementById('more');
    const update = () => { pickScrollTop = sc.scrollTop; more.classList.toggle('gone', sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 8); };
    sc.addEventListener('scroll', update, { passive: true });
    update();
  }
}
let pickScrollTop = 0;

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.go) at = Number(t.dataset.go);
  else if (t.dataset.pick) { const id = t.dataset.pick; picked.has(id) ? picked.delete(id) : picked.add(id); }
  else if (t.dataset.key) {
    const k = t.dataset.key, i = Number(t.dataset.i);
    if (t.dataset.multi) { const cur = new Set(choice[k] ?? [0, 1]); cur.has(i) ? cur.delete(i) : cur.add(i); choice[k] = [...cur]; }
    else choice[k] = i;
  } else if (t.dataset.nav) at = Math.max(0, Math.min(steps().length - 1, at + Number(t.dataset.nav)));
  else return;
  render();
});
render();
</script>
</body>
</html>
